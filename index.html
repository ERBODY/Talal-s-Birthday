<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Card</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style>
    *::before,
    *::after {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(to bottom, #D3D3D3, #000000); /* التدرج الجديد */
      font-family: Arial, sans-serif;
      text-align: center;
      color: #ffffff;
    }

    /* الصفحة الأولى */
    .first-page {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(to bottom, #D3D3D3, #000000); /* التدرج الجديد */
      color: #ffffff;
    }

    .click-button {
      font-size: 24px;
      padding: 15px 30px;
      border: none;
      background-color: #808080; /* لون رمادي متوسط */
      color: white;
      font-weight: bold;
      cursor: pointer;
      border-radius: 10px;
      transition: background-color 0.3s ease;
    }

    .click-button:hover {
      background-color: #666666; /* رمادي داكن عند التحويم */
    }

    /* بقية الأكواد كما هي مع تعديل الألوان التوضيحية */
    .container {
      width: 400px;
      height: 400px;
      background-color: #ffffff;
      position: absolute;
      transform: translate(-50%, -50%);
      top: 50%;
      left: 50%;
      border-radius: 80px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
      padding-top: 170px;
      display: none;
    }

    /* ... بقية الأكواد بدون تعديل ... */

  </style>
</head>
<body>
  <!-- نفس الهيكل HTML السابق -->
  <div class="first-page" id="first-page">
    <button class="click-button" onclick="showBirthdayCard()">Click Here, Talal!</button>
  </div>

  <div class="container" id="birthday-card">
    <h1>Happy 15th Birthday, Talal!</h1>
    <p>Big respect for starting your gym journey, stay strong and keep grinding.
This is just the beginning bro💪🔥.<br>Your friend, Abed.</p>
    <div class="timer" id="countdown"></div>
    <div class="cake">
      <div class="candle"></div>
      <div class="top-layer"></div>
      <div class="middle-layer"></div>
      <div class="bottom-layer"></div>
    </div>
  </div>

  <!-- نفس السكريبت السابق -->
  <script>
  function showBirthdayCard() {
    // إخفاء الصفحة الأولى
    document.getElementById('first-page').style.display = 'none';
    // عرض الصفحة الثانية
    document.getElementById('birthday-card').style.display = 'block';
    
    // بدء حساب المدة منذ الولادة
    const birthDate = new Date('2010-04-15T00:00:00');
    setInterval(function() {
      const now = new Date();
      const timeElapsed = now - birthDate;

      const days = Math.floor(timeElapsed / (1000 * 60 * 60 * 24));
      const hours = Math.floor((timeElapsed % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((timeElapsed % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((timeElapsed % (1000 * 60)) / 1000);

      document.getElementById('countdown').innerHTML =
        `The world just got luckier since: <br> ${days}d ${hours}h ${minutes}m ${seconds}s`;
    }, 1000);
  }
</script>
</body>
</html>
